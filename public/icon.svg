<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a12"/>

  <!-- Outer glow -->
  <polygon
    points="256,52 436,156 436,356 256,460 76,356 76,156"
    fill="url(#glowGrad)"
    filter="url(#glow)"
    opacity="0.6"
  />

  <!-- Hexagon border -->
  <polygon
    points="256,72 416,164 416,348 256,440 96,348 96,164"
    stroke="url(#hexGrad)"
    stroke-width="2.5"
    fill="none"
    opacity="0.7"
  />

  <!-- Hexagon fill -->
  <polygon
    points="256,82 408,170 408,342 256,430 104,342 104,170"
    fill="#0c0c18"
    stroke="url(#hexGrad)"
    stroke-width="1"
  />

  <!-- Code bracket symbol  </> -->
  <g filter="url(#innerGlow)">
    <!-- < bracket -->
    <path
      d="M175,200 L135,256 L175,312"
      stroke="url(#hexGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- / slash -->
    <line
      x1="235"
      y1="190"
      x2="277"
      y2="322"
      stroke="#8b5cf6"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- > bracket -->
    <path
      d="M337,200 L377,256 L337,312"
      stroke="url(#hexGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Subtle corner accents -->
  <circle cx="96" cy="164" r="3" fill="#6366f1" opacity="0.5"/>
  <circle cx="416" cy="164" r="3" fill="#6366f1" opacity="0.5"/>
  <circle cx="96" cy="348" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="416" cy="348" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="256" cy="72" r="3" fill="#a78bfa" opacity="0.5"/>
  <circle cx="256" cy="440" r="3" fill="#a78bfa" opacity="0.5"/>
</svg>
