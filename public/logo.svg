<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" style="enable-background:new 0 0 40 40;" xml:space="preserve">
  <defs>
    <style>
      .logo-bg { fill: oklch(0.7 0.18 260); }
      .logo-text { fill: #FFFFFF; }
      .logo-pulse {
        animation: logoPulse 3s ease-in-out infinite;
      }
      @keyframes logoPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  <g class="logo-pulse">
    <rect class="logo-bg" x="2" y="2" width="36" height="36" rx="8" ry="8"/>
    <text class="logo-text" x="20" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1">SJT</text>
  </g>
</svg>
